name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Verify release documentation and retained assets
        run: uv run --locked python scripts/check-docs.py
      - run: uv run --locked workbench-fixtures --check fixtures/generated
      - run: uv run --locked pytest -q
      - name: Evaluate versioned investigation corpus offline (no paid provider calls)
        run: uv run --locked python -m workbench.evaluation --output runs/evals-offline
      - name: Explain saved SQL evidence offline (no API key or SQL connection)
        run: uv run --locked workbench explain --packet docs/evidence/p05/golden-evidence.json --provider stub --format text
      - name: Install browser for isolated UI checks
        run: uv run --locked python -m playwright install --with-deps chromium
      - name: Verify screen against explicit in-memory fixtures
        run: uv run --locked python scripts/check-ui.py --fixture --origin http://127.0.0.1:8017 --output runs/ui-fixture

  sql-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable database credential
        shell: bash
        run: |
          password="Wb1!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "WB_SQL_PASSWORD=$password" >> "$GITHUB_ENV"
          runtime_password="Wb1!$(openssl rand -hex 24)"
          echo "::add-mask::$runtime_password"
          echo "WB_SQL_RUNTIME_PASSWORD=$runtime_password" >> "$GITHUB_ENV"
          for role in ANALYST OPERATOR; do
            token="$(openssl rand -hex 24)"
            echo "::add-mask::$token"
            echo "WB_DEMO_${role}_TOKEN=$token" >> "$GITHUB_ENV"
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start SQL Server and wait for readiness
        run: docker compose up -d --wait --wait-timeout 240 sqlserver
      - name: Build and check the runtime image
        run: |
          docker compose build workbench
          docker compose --profile tools run --build --rm migrate
          docker compose --profile tools run --rm migrate
          docker compose run --rm workbench config-check
          docker compose run --rm workbench health
          docker compose run --rm workbench db-smoke
      - name: Record verified SQL reconciliation walkthrough
        run: |
          docker compose --profile sources up -d --build --wait --wait-timeout 120 mock-registry
          curl --fail --silent --show-error http://127.0.0.1:8001/projects
          docker compose --profile tools run --rm migrate seed-departments
          mkdir -p runs
          docker compose run --rm --user "$(id -u):$(id -g)" --volume "$PWD/runs:/app/runs" -e WB_BUILD_REVISION="$GITHUB_SHA" workbench demo --output-dir /app/runs/demo
      - name: Verify the running evidence API and historical lifecycle
        run: |
          docker compose --profile web up -d --build --wait --wait-timeout 120 api
          python3 scripts/check-api.py
      - name: Run tests including real SQL Server transactions
        timeout-minutes: 15
        run: |
          mkdir -p runs/p11
          set -o pipefail
          docker compose --profile test run --build --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/runs/p11:/app/p11-evidence" \
            -e WB_P11_EVIDENCE_DIR=/app/p11-evidence \
            tests -v -p no:cacheprovider --run-sql --durations=15 2>&1 | tee runs/sql-checks.txt
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - name: Install browser for the SQL-backed UI walkthrough
        run: uv run --locked --python 3.12 python -m playwright install --with-deps chromium
      - name: Verify and record operator workflow in a separate demo database
        env:
          WB_SQL_DATABASE: workbench_ui
        run: |
          docker compose --profile tools run --rm migrate
          docker compose --profile tools run --rm migrate seed-departments
          reference_hash="$(python3 -c 'import json; print(json.load(open("fixtures/generated/index.json"))["reference_sets"]["default"])')"
          docker compose run --rm workbench load-departments --reference-hash "$reference_hash"
          docker compose run --rm workbench load-projects
          docker compose --profile web up -d --no-deps --force-recreate --wait --wait-timeout 120 api
          uv run --locked python scripts/check-ui.py --output runs/ui-sql
      - name: Render captured demo output
        run: uv run --locked --python 3.12 python scripts/render-demo.py runs/demo/recording.json runs/demo/media
      - name: Save actual SQL-backed UI captures and browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-demo
          path: runs/ui-sql/
          if-no-files-found: ignore
      - name: Save SQL walkthrough and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-demo
          path: runs/demo/
          if-no-files-found: ignore
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-checks
          path: runs/sql-checks.txt
          if-no-files-found: ignore
      - name: Save recovery, restore, and query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p11-evidence
          path: runs/p11/
          if-no-files-found: ignore
      - name: Remove disposable containers and test database
        if: always()
        run: docker compose --profile test --profile sources --profile tools --profile web down --volumes --remove-orphans
